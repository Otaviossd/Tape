*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
.wrap{max-width:340px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 24px 80px}
.logo{display:flex;align-items:center;gap:10px}
.mark{position:relative;width:22px;height:22px}
.mark:before,.mark:after{content:"";position:absolute;background:var(--teal);border-radius:1px}
.mark:before{left:50%;top:0;width:3px;height:100%;transform:translateX(-50%)}
.mark:after{top:50%;left:0;height:3px;width:100%;transform:translateY(-50%)}
.logo b{font-size:15px;font-weight:700;letter-spacing:.24em;padding-left:2px}
h1{margin:34px 0 14px;font-size:30px;line-height:1.04;font-weight:700;letter-spacing:-.045em}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
h1 .w>span{display:inline-block}
h1 em{font-style:normal;color:var(--teal)}
.js h1 .w>span{transform:translateY(112%);animation:up .9s var(--ease) forwards;animation-delay:calc(.25s + var(--i)*.07s)}
@keyframes up{to{transform:none}}
.sub{font-size:14px;line-height:1.55;color:var(--muted)}
.links{display:flex;flex-direction:column;gap:9px;width:100%;margin-top:30px}
.lk{position:relative;overflow:hidden;display:flex;align-items:center;gap:11px;height:48px;padding:0 6px 0 16px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14px;letter-spacing:-.005em;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.6));border:1px solid rgba(7,11,10,.12);box-shadow:inset 0 1px 0 #fff,0 12px 26px -18px rgba(0,0,0,.45);transition:transform .3s var(--ease)}
.lk svg{flex:0 0 17px;width:17px;height:17px}
.lk span{flex:1;text-align:left}
.lk .ar{flex:0 0 34px;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(7,11,10,.06);border:1px solid rgba(7,11,10,.1)}
.lk .ar svg{width:14px;height:14px}
.lk:active{transform:scale(.98)}
.lk.main{color:#fff;border-color:#000;background:linear-gradient(180deg,#2b3634,#070b0a);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 16px 30px -16px rgba(0,0,0,.7)}
.lk.main>svg:first-child{color:#74e3d6}
.lk.main .ar{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
@media(hover:hover){.lk:hover{transform:translateY(-2px)}}
.js .fade{opacity:0;transform:translateY(12px);animation:fd .9s var(--ease) forwards;animation-delay:calc(.6s + var(--i)*.1s)}
.js .logo{opacity:0;animation:fd .8s var(--ease) .05s forwards}
@keyframes fd{to{opacity:1;transform:none}}
.foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 20px);text-align:center;font-size:11.5px;color:rgba(7,11,10,.42);letter-spacing:.02em}
@media(prefers-reduced-motion:reduce){.js h1 .w>span,.js .fade,.js .logo{animation:none;transform:none;opacity:1}}
</style>

<script>
(function(){var h=document.getElementById('t'),i=0;function walk(n,out){n.childNodes.forEach(function(c){if(c.nodeType===3){c.textContent.split(/(\s+)/).forEach(function(p){if(!p)return;if(/^\s+$/.test(p)){out.appendChild(document.createTextNode(' '))}else{var w=document.createElement('span');w.className='w';var s=document.createElement('span');s.style.setProperty('--i',i++);s.textContent=p;w.appendChild(s);out.appendChild(w)}})}else if(c.nodeType===1){var e=c.cloneNode(false);walk(c,e);out.appendChild(e)}})}
var o=h.cloneNode(false);walk(h,o);h.innerHTML=o.innerHTML})();
</script>
