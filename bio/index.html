  .lk span{flex:1}
  .lk .go{flex:0 0 14px;width:14px;height:14px;opacity:.35}
  .lk.main{background:var(--ink);border-color:var(--ink);color:#fff}
  .lk.main svg:first-child{color:var(--teal)}
  .lk.main .go{opacity:.5}
  @media (hover:hover){.lk:hover{border-color:rgba(10,14,13,.28)}.lk.main:hover{background:#1b2321}}
  .foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 20px);text-align:center;font-size:11.5px;color:#9aa09e}
  .rise{opacity:0;transform:translateY(8px);animation:rise .5s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}}
