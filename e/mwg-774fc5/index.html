<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MWG</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f3ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f3ef;--paper2:#eaeae4;--ink:#070b0a;--muted:#69706e;--teal:#3FAFA3;--deep:#0F2E2B;--line:rgba(7,11,10,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{padding:30px 0 6px;display:flex;justify-content:center}
.logo{display:inline-flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.18em;font-size:11px;color:var(--muted);opacity:.8}
.mk{position:relative;width:10px;height:10px}.mk:before,.mk:after{content:"";position:absolute;background:var(--teal);border-radius:1px}
.mk:before{left:0;top:4px;width:10px;height:2px}.mk:after{left:4px;top:0;width:2px;height:10px}
.hero{padding:48px 0 34px}
.tg{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:14px}
h1{font-weight:500;font-size:clamp(38px,7vw,64px);letter-spacing:-.045em;line-height:1}
h1 em{font-style:normal;color:var(--teal)}
.ld{margin-top:16px;color:var(--muted);font-size:16px;max-width:560px;line-height:1.5}
h2{font-weight:600;font-size:22px;letter-spacing:-.02em;margin:34px 0 16px;display:flex;align-items:baseline;justify-content:center;gap:10px}
h2 small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.vg{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}.vg>.vc{width:240px;max-width:100%}
.vc{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(7,11,10,.06),0 12px 32px rgba(7,11,10,.06)}
.th{position:relative;aspect-ratio:9/16;background:linear-gradient(160deg,#16211f,#0F2E2B);display:flex;align-items:center;justify-content:center;overflow:hidden}
.th img,.th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.th .ph{position:relative;color:rgba(255,255,255,.55);font-size:13px;font-weight:500;text-align:center;padding:16px}
.th.land{aspect-ratio:16/10}
.vb{padding:14px 16px 16px}
.vb b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.vb span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.dl{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border-radius:999px;border:0;background:var(--ink);color:#fff;font:600 14.5px Inter,sans-serif;text-decoration:none;cursor:pointer}
.dl:hover{background:var(--deep)}
.dl.off{background:var(--paper2);color:var(--muted);cursor:default}
.dl svg{width:17px;height:17px}
.pg{columns:4 150px;column-gap:10px}
.pg button{display:block;width:100%;margin:0 0 12px;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--paper2);cursor:zoom-in;break-inside:avoid;position:relative}
.pg img{display:block;width:100%;height:auto;transition:transform .8s cubic-bezier(.16,.8,.24,1)}
.pg button:hover img{transform:scale(1.04)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,260px));gap:16px;justify-content:center;margin-top:34px}
.cat{position:relative;display:block;aspect-ratio:3/4;border:0;padding:0;border-radius:20px;overflow:hidden;cursor:pointer;background:#0F2E2B;box-shadow:0 12px 32px rgba(7,11,10,.10)}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.16,.8,.24,1)}
.cat:hover img{transform:scale(1.04)}
.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,10,0) 45%,rgba(7,11,10,.78))}
.cat span{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;text-align:left;color:#fff}
.cat b{display:block;font:600 21px Inter,sans-serif;letter-spacing:-.02em}
.cat i{display:block;font-style:normal;font-size:13px;opacity:.8;margin-top:2px}
.back{border:0;background:none;font:500 14px Inter,sans-serif;color:var(--muted);cursor:pointer;margin-top:22px;padding:6px 0}
.back:hover{color:var(--ink)}
#fotoMain button{display:block;width:100%;max-width:820px;margin:0 auto 12px;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:zoom-in;background:var(--paper2)}
#fotoMain img{display:block;width:100%;height:auto}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cat b{font-size:17px}}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:26px;color:var(--muted);font-size:14px;text-align:center}
footer{padding:56px 0 40px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--ink);text-decoration:none;font-weight:500}
.lb{position:fixed;inset:0;background:rgba(7,11,10,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:calc(100vh - 120px);border-radius:10px}
.lb .x{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:26px;cursor:pointer}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:26px;cursor:pointer}
.lb .pv{left:14px}.lb .nx{right:14px}
.lb .lbdl{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:auto;padding:0 24px;background:#fff;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="logo"><span class="mk"></span>TAPE</span></header>

  <div id="home" class="view">
    <div class="cats">
      <button class="cat" data-go="comerciales"><img alt="" src="c01.jpg"><span><b>Comerciales</b><i id="nCom"></i></span></button>
      <button class="cat" data-go="comitiva"><img alt="" src="k01.jpg"><span><b>Comitiva</b><i>Conferencia de prensa</i></span></button>
    </div>
  </div>

  <div id="v-comerciales" class="view" hidden>
    <button class="back" data-go="">&#8249; Volver</button>
    <h2>Comerciales</h2>
    <div class="vg" id="comerciales"></div>
  </div>

  <div id="v-comitiva" class="view" hidden>
    <button class="back" data-go="">&#8249; Volver</button>
    <h2>Comitiva</h2>
    <div class="vg" id="cobertura"></div>
    <div id="fotosSec" style="display:none">
      <h2>Fotos <small id="fotosN"></small></h2>
      <div style="display:flex;justify-content:center;margin:-4px 0 16px"><a class="dl" style="width:auto;padding:0 22px;margin:0" href="fotos-comitiva-mwg.zip" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Descargar todas las fotos</a></div>
      <div id="fotoMain"></div>
      <div class="pg" id="fotos"></div>
    </div>
  </div>
</div>

<div class="lb" id="lb" role="dialog" aria-label="Foto">
  <button class="x" aria-label="Cerrar">&times;</button>
  <button class="nv pv" aria-label="Anterior">&#8249;</button>
  <img alt="">
  <button class="nv nx" aria-label="Siguiente">&#8250;</button>
  <a class="dl lbdl" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Descargar foto</a>
</div>

<script>
/* ====== CONTENIDO (editar acá) ======
   drive: link del archivo en Google Drive (compartido como "Cualquier persona con el enlace").
   Sin link = aparece como "Próximamente". */
const COMERCIALES = [
  { title: 'Comercial 01', sub: 'Video comercial', drive: 'https://drive.google.com/file/d/1NJyuTnSf3wRUXGxFtyS3Ww_ww8cEsFxi/view?usp=drivesdk', poster: 'c01.jpg', preview: 'c01.mp4' },
  { title: 'Comercial 02', sub: 'Video comercial', drive: 'https://drive.google.com/file/d/1FQIx1Hqfw-cGliGl5z398ZJFe1jhc63f/view?usp=drivesdk', poster: 'c02.jpg', preview: 'c02.mp4' },
];
const COBERTURA = [
  { title: 'Comitiva', sub: 'Conferencia de prensa', drive: 'https://drive.google.com/file/d/1W_BssXILErj8xLEqHEdiuwsELbvXmkcf/view?usp=drivesdk', poster: 'k01.jpg', preview: 'k01.mp4' },
];
// Fotos: un objeto por foto. src = imagen liviana para mostrar; drive = original para descargar (opcional)
const FOTOS = [
  { src: 't/mwg-01.webp', file: 'f/mwg-01.jpg' },
  { src: 't/mwg-02.webp', file: 'f/mwg-02.jpg' },
  { src: 't/mwg-03.webp', file: 'f/mwg-03.jpg' },
  { src: 't/mwg-04.webp', file: 'f/mwg-04.jpg' },
  { src: 't/mwg-05.webp', file: 'f/mwg-05.jpg' },
  { src: 't/mwg-06.webp', file: 'f/mwg-06.jpg' },
  { src: 't/mwg-07.webp', file: 'f/mwg-07.jpg' },
  { src: 't/mwg-08.webp', file: 'f/mwg-08.jpg' },
  { src: 't/mwg-09.webp', file: 'f/mwg-09.jpg' },
  { src: 't/mwg-10.webp', file: 'f/mwg-10.jpg' },
  { src: 't/mwg-11.webp', file: 'f/mwg-11.jpg' },
  { src: 't/mwg-12.webp', file: 'f/mwg-12.jpg' },
  { src: 't/mwg-13.webp', file: 'f/mwg-13.jpg' },
  { src: 't/mwg-14.webp', file: 'f/mwg-14.jpg' },
  { src: 't/mwg-15.webp', file: 'f/mwg-15.jpg' },
  { src: 't/mwg-16.webp', file: 'f/mwg-16.jpg' },
  { src: 't/mwg-17.webp', file: 'f/mwg-17.jpg' },
  { src: 't/mwg-18.webp', file: 'f/mwg-18.jpg' },
  { src: 't/mwg-19.webp', file: 'f/mwg-19.jpg' },
  { src: 't/mwg-20.webp', file: 'f/mwg-20.jpg' },
  { src: 't/mwg-21.webp', file: 'f/mwg-21.jpg' },
  { src: 't/mwg-22.webp', file: 'f/mwg-22.jpg' },
  { src: 't/mwg-23.webp', file: 'f/mwg-23.jpg' },
  { src: 't/mwg-24.webp', file: 'f/mwg-24.jpg' },
  { src: 't/mwg-25.webp', file: 'f/mwg-25.jpg' },
  { src: 't/mwg-26.webp', file: 'f/mwg-26.jpg' },
  { src: 't/mwg-27.webp', file: 'f/mwg-27.jpg' },
  { src: 't/mwg-28.webp', file: 'f/mwg-28.jpg' },
  { src: 't/mwg-29.webp', file: 'f/mwg-29.jpg' },
  { src: 't/mwg-30.webp', file: 'f/mwg-30.jpg' },
  { src: 't/mwg-31.webp', file: 'f/mwg-31.jpg' },
  { src: 't/mwg-32.webp', file: 'f/mwg-32.jpg' },
  { src: 't/mwg-33.webp', file: 'f/mwg-33.jpg' },
  { src: 't/mwg-34.webp', file: 'f/mwg-34.jpg' },
  { src: 't/mwg-35.webp', file: 'f/mwg-35.jpg' },
  { src: 't/mwg-36.webp', file: 'f/mwg-36.jpg' },
  { src: 't/mwg-37.webp', file: 'f/mwg-37.jpg' },
  { src: 't/mwg-38.webp', file: 'f/mwg-38.jpg' },
  { src: 't/mwg-39.webp', file: 'f/mwg-39.jpg' },
  { src: 't/mwg-40.webp', file: 'f/mwg-40.jpg' },
  { src: 't/mwg-41.webp', file: 'f/mwg-41.jpg' },
  { src: 't/mwg-42.webp', file: 'f/mwg-42.jpg' },
  { src: 't/mwg-43.webp', file: 'f/mwg-43.jpg' },
  { src: 't/mwg-44.webp', file: 'f/mwg-44.jpg' },
  { src: 't/mwg-45.webp', file: 'f/mwg-45.jpg' },
  { src: 't/mwg-46.webp', file: 'f/mwg-46.jpg' },
  { src: 't/mwg-47.webp', file: 'f/mwg-47.jpg' },
  { src: 't/mwg-48.webp', file: 'f/mwg-48.jpg' },
  { src: 't/mwg-49.webp', file: 'f/mwg-49.jpg' },
  { src: 't/mwg-50.webp', file: 'f/mwg-50.jpg' },
  { src: 't/mwg-51.webp', file: 'f/mwg-51.jpg' },
];

const idOf = u => { const m = String(u || '').match(/\/d\/([\w-]{10,})/) || String(u || '').match(/[?&]id=([\w-]{10,})/); return m ? m[1] : ''; };
const dlOf = u => { const id = idOf(u); return id ? 'https://drive.usercontent.google.com/download?id=' + encodeURIComponent(id) + '&export=download&confirm=t' : ''; };
const thumbOf = (u, w) => { const id = idOf(u); return id ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 720) : ''; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
function card(v, land){
  const dl = dlOf(v.drive), th = v.poster || thumbOf(v.drive);
  const media = v.preview
    ? `<video controls playsinline preload="none" controlsList="nodownload noplaybackrate" disablepictureinpicture poster="${esc(th || '')}" src="${esc(v.preview)}"></video>`
    : (th ? `<img loading="lazy" alt="" src="${th}" onerror="this.remove()">` : `<span class="ph">${dl ? '' : 'Próximamente'}</span>`);
  return `<div class="vc"><div class="th${land ? ' land' : ''}">${media}</div>
    <div class="vb"><b>${esc(v.title)}</b><span>${esc(v.sub || '')}</span>
    ${dl ? `<a class="dl" href="${dl}" rel="noopener">${ICON}Descargar</a>` : '<span class="dl off">Próximamente</span>'}</div></div>`;
}
document.getElementById('comerciales').innerHTML = COMERCIALES.map(v => card(v)).join('');
document.getElementById('cobertura').innerHTML = COBERTURA.map(v => card(v)).join('');
document.getElementById('nCom').textContent = COMERCIALES.length + (COMERCIALES.length === 1 ? ' video' : ' videos');
if(FOTOS.length){
  document.getElementById('fotosSec').style.display = '';
  document.getElementById('fotosN').textContent = FOTOS.length + ' fotos';
  document.getElementById('fotoMain').innerHTML = `<button data-i="0" aria-label="Ver foto principal"><img alt="Foto principal" src="${esc(FOTOS[0].src)}"></button>`;
  document.getElementById('fotos').innerHTML = FOTOS.slice(1).map((f, j) => { const i = j + 1; return `<button data-i="${i}" aria-label="Ver foto ${i + 1}"><img loading="lazy" decoding="async" alt="Foto ${i + 1} de la cobertura" src="${esc(f.src)}"></button>`; }).join('');
}
// visor de fotos con descarga
const lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbDl = lb.querySelector('.lbdl'); let cur = 0;
function show(i){ cur = (i + FOTOS.length) % FOTOS.length; const f = FOTOS[cur]; lbImg.src = f.src; lbDl.href = dlOf(f.drive) || f.file || f.src; lbDl.setAttribute('download', (f.file || f.src).split('/').pop()); lb.classList.add('on'); document.body.style.overflow = 'hidden'; }
function hide(){ lb.classList.remove('on'); document.body.style.overflow = ''; }
document.getElementById('fotoMain').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(b) show(+b.dataset.i); });
document.getElementById('fotos').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(b) show(+b.dataset.i); });
lb.querySelector('.x').onclick = hide; lb.querySelector('.pv').onclick = () => show(cur - 1); lb.querySelector('.nx').onclick = () => show(cur + 1);
lb.addEventListener('click', e => { if(e.target === lb) hide(); });
// deslizar com o dedo para passar as fotos (para baixo fecha)
let tx = null, ty = null;
lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
lb.addEventListener('touchend', e => { if(tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = ty = null;
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1)); else if(dy > 90 && Math.abs(dy) > Math.abs(dx)) hide(); });
document.addEventListener('keydown', e => { if(!lb.classList.contains('on')) return; if(e.key === 'Escape') hide(); if(e.key === 'ArrowLeft') show(cur - 1); if(e.key === 'ArrowRight') show(cur + 1); });
// navegação entre seções (#comerciales, #comitiva)
function route(){ const k = location.hash.slice(1); document.querySelectorAll('.view').forEach(v => v.hidden = true); const el = document.getElementById(k ? 'v-' + k : 'home') || document.getElementById('home'); el.hidden = false; document.querySelectorAll('video').forEach(v => { if(!el.contains(v)) v.pause(); }); window.scrollTo(0, 0); }
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if(!b) return; const k = b.dataset.go; if(k) location.hash = k; else history.length > 1 && location.hash ? history.back() : (location.hash = ''); });
window.addEventListener('hashchange', route); route();
</script>
<footer style="display:block;max-width:1080px;margin:0 auto;padding:22px 20px 28px;text-align:center;white-space:nowrap;color:#69706e;font-size:12.5px;letter-spacing:.02em">Producido por <b style="color:#070b0a;font-weight:600">Tape</b> para <b style="color:#070b0a;font-weight:600">JM</b></footer>
</body>
</html>
